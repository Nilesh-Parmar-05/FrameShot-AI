[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameshot"
version = "0.1.0"
description = "Smart video companion for VLC: offline word assist and frame insight on pause."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FrameShot-AI Team" }]
keywords = ["vlc", "subtitles", "vocabulary", "yolo", "offline-first"]

# Core runtime. Everything here is required for `python -m frameshot`.
dependencies = [
    "requests>=2.32",
    "pysubs2>=1.7",
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# PyQt6 overlay UI (Phase 2).
ui = ["PyQt6>=6.6"]
# NLTK tokenizer / WordNet / CMUdict (Phase 1).
nlp = ["nltk>=3.8"]
# Vision pipeline (Phase 2). Heavy: pulls torch.
vision = [
    "ultralytics>=8.2",
    "transformers>=4.40",
    "torch>=2.2",
    "Pillow>=10.0",
    "numpy>=1.26",
    "psutil>=5.9",
]
# Online enrichment (Phase 3).
online = ["httpx>=0.27"]
# Development tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
frameshot = "frameshot.__main__:main"

[tool.setuptools.packages.find]
include = ["frameshot*"]

[tool.setuptools.package-data]
frameshot = ["resources/**/*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a running VLC instance, downloaded models, or network access",
]

# ---------------------------------------------------------------- black
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["frameshot", "tests", "spikes", "scripts"]
extend-exclude = ["models", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
# Black owns line wrapping; E501 would fight it on long strings.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["frameshot"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["frameshot"]

# Optional extras (vision, ui, nlp) may be absent in a core-only install.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "pysubs2",
    "torch",
    "torch.*",
    "transformers",
    "ultralytics",
    "nltk",
    "PyQt6",
    "PyQt6.*",
]
ignore_missing_imports = true
